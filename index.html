<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售赋能平台 | B2B留学顾问</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
    <style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--primary:#2b6cb0;--primary-light:#ebf8ff;--primary-dark:#2c5282;--gray-50:#f7fafc;--gray-100:#edf2f7;--gray-200:#e2e8f0;--gray-300:#cbd5e0;--gray-400:#a0aec0;--gray-500:#718096;--gray-600:#4a5568;--gray-700:#2d3748;--gray-800:#1a202c;--green-100:#c6f6d5;--green-500:#38a169;--red-100:#fed7d7;--red-500:#e53e3e;--orange-100:#feebcb;--orange-500:#ed8936;--purple-100:#e9d8fd;--purple-500:#805ad5;--shadow:0 4px 12px rgba(0,0,0,0.08);--shadow-lg:0 10px 30px rgba(0,0,0,0.15);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-700);line-height:1.6;display:flex;min-height:100vh;}
.sidebar{width:260px;background:linear-gradient(180deg,var(--primary-dark) 0%,#1a365d 100%);color:white;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;}
.sidebar-header{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-logo{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;}
.sidebar-subtitle{font-size:12px;opacity:0.7;margin-top:4px;}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto;}
.nav-section{margin-bottom:24px;}
.nav-section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:0.5;padding:0 12px;margin-bottom:8px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;color:rgba(255,255,255,0.8);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;cursor:pointer;margin-bottom:4px;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.nav-item:hover{background:rgba(255,255,255,0.1);color:white;}
.nav-item.active{background:rgba(255,255,255,0.15);color:white;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.nav-item .icon{font-size:20px;width:24px;text-align:center;}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);font-size:12px;opacity:0.6;}
.main{flex:1;margin-left:260px;padding:32px;min-height:100vh;}
.page-header{margin-bottom:32px;}
.page-title{font-size:28px;font-weight:700;color:var(--gray-800);margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.page-desc{color:var(--gray-500);font-size:15px;}
.card{background:white;border-radius:16px;box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden;}
.card-header{padding:20px 24px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
.card-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px;}
.card-body{padding:24px;}
.btn{padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit;}
.btn-primary{background:var(--primary);color:white;}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);}
.btn-secondary{background:var(--gray-100);color:var(--gray-600);}
.btn-secondary:hover{background:var(--gray-200);}
.btn-success{background:var(--green-500);color:white;}
.btn-danger{background:var(--red-500);color:white;}
.actions-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.page-section{display:none;}
.page-section.active{display:block;}
.competitor-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.competitor-card{background:var(--gray-50);border-radius:12px;padding:20px;border:2px solid var(--gray-200);transition:all .2s;}
.competitor-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(43,108,176,0.15);}
.chart-container{max-width:600px;margin:0 auto;}
.comparison-table-wrapper{overflow-x:auto;}
.comparison-table{width:100%;border-collapse:collapse;}
.comparison-table th{background:var(--gray-100);padding:14px 16px;text-align:left;font-weight:600;color:var(--gray-600);font-size:13px;border-bottom:2px solid var(--gray-200);white-space:nowrap;}
.comparison-table td{padding:12px 16px;border-bottom:1px solid var(--gray-200);font-size:14px;}
.comparison-table tr:hover td{background:var(--gray-50);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:white;border-radius:16px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:20px;font-weight:600;}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--gray-400);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.modal-close:hover{background:var(--gray-100);color:var(--gray-600);}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:12px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;}
.form-group{display:flex;flex-direction:column;}
.form-group.full{grid-column:1/-1;}
.form-label{font-size:13px;font-weight:500;color:var(--gray-600);margin-bottom:6px;}
.form-input,.form-textarea,.form-select{padding:10px 14px;border:2px solid var(--gray-200);border-radius:8px;font-size:14px;transition:border-color .2s;font-family:inherit;}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--primary);background:var(--gray-50);}
.form-textarea{min-height:80px;resize:vertical;}
.score-input-group{display:flex;align-items:center;gap:12px;}
.score-slider{flex:1;height:6px;border-radius:3px;background:var(--gray-200);outline:none;-webkit-appearance:none;}
.score-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(43,108,176,0.4);}
.score-value{min-width:40px;text-align:center;font-weight:600;font-size:16px;color:var(--primary);}
.script-category-title{font-size:16px;font-weight:600;color:var(--gray-700);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--primary);display:flex;align-items:center;gap:8px;}
.script-item{background:white;border:1px solid var(--gray-200);border-radius:10px;padding:16px;margin-bottom:12px;transition:all .2s;}
.script-item:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(43,108,176,0.1);}
.script-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
.script-title{font-weight:600;color:var(--gray-800);}
.script-tag{padding:2px 10px;border-radius:12px;font-size:11px;font-weight:500;}
.tag-touch{background:#ebf8ff;color:var(--primary);}
.tag-need{background:#fefcbf;color:#975a16;}
.tag-objection{background:#fed7d7;color:#c53030;}
.tag-close{background:#c6f6d5;color:var(--green-500);}
.tag-maintain{background:var(--gray-100);color:var(--gray-600);}
.script-content{font-size:14px;color:var(--gray-600);line-height:1.8;padding:8px 12px;background:var(--gray-50);border-radius:8px;}
.script-actions{margin-top:10px;display:flex;gap:8px;}
.tool-card{background:white;border-radius:12px;padding:20px;border:2px solid var(--gray-200);transition:all .2s;cursor:pointer;}
.tool-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 12px rgba(43,108,176,0.15);}
.tool-icon{font-size:32px;margin-bottom:12px;}
.tool-name{font-size:16px;font-weight:600;color:var(--gray-800);margin-bottom:6px;}
.tool-desc{font-size:13px;color:var(--gray-500);}
.tool-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;background:var(--gray-100);color:var(--gray-500);margin-top:8px;}
.question-card{background:white;border-radius:12px;padding:24px;margin-bottom:16px;border:2px solid var(--gray-200);}
.question-text{font-size:16px;font-weight:500;color:var(--gray-800);margin-bottom:16px;}
.option-item{padding:12px 16px;background:var(--gray-50);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s;border:2px solid transparent;}
.option-item:hover{background:var(--primary-light);border-color:var(--primary);}
.option-item.selected{background:var(--primary-light);border-color:var(--primary);}
.progress-bar{width:100%;height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--primary);transition:width .3s;}
.result-card{background:white;border-radius:16px;padding:32px;text-align:center;box-shadow:var(--shadow);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--gray-800);color:white;padding:14px 24px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .3s;z-index:1001;}
.toast.show{opacity:1;}
.empty-state{text-align:center;padding:60px 20px;color:var(--gray-400);}
.empty-state .icon{font-size:48px;margin-bottom:16px;}
.fade-in{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.ref-table-wrapper{overflow-x:auto;background:white;border-radius:16px;border:1px solid var(--gray-200);}
.ref-table{width:100%;border-collapse:collapse;min-width:800px;font-size:13px;}
.ref-table th{background:var(--gray-800);color:white;padding:12px 16px;text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
.ref-table td{padding:10px 16px;border-bottom:1px solid var(--gray-100);vertical-align:top;}
.ref-table tr:last-child td{border-bottom:none;}
.ref-table tr:hover td{background:var(--gray-50);}
.type-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.type-section{margin-bottom:24px;background:white;border-radius:12px;border:1px solid var(--gray-200);overflow:hidden;}
.type-header{display:flex;align-items:center;gap:16px;padding:16px 20px;cursor:pointer;transition:background .2s;}
.type-header:hover{background:var(--gray-50);}
.type-body{display:none;padding:0 20px 20px;}
.type-body.open{display:block;}
@media(max-width:768px){.sidebar{transform:translateX(-100%);}.main{margin-left:0;padding:16px;}.grid-2,.grid-3{grid-template-columns:1fr;}}
    </style>
</head>
<body>


<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo"><span>🚀</span> 销售赋能平台</div>
        <div class="sidebar-subtitle">B2B留学顾问专业工具箱</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">
            <div class="nav-section-title">核心工具</div>
            <button class="nav-item active" onclick="switchPage('competitor')" id="nav-competitor"><span class="icon">📊</span> 竞品分析</button>
            <button class="nav-item" onclick="switchPage('scripts')" id="nav-scripts"><span class="icon">💬</span> 话术库</button>
            <button class="nav-item" onclick="switchPage('tools')" id="nav-tools"><span class="icon">🛠️</span> 工具库</button>
        </div>
        <div class="nav-section">
            <div class="nav-section-title">自我提升</div>
            <button class="nav-item" onclick="switchPage('enneagram')" id="nav-enneagram"><span class="icon">🧩</span> 九型测试</button>
        </div>
    </nav>
    <div class="sidebar-footer">妮妮 · 成长守护 🐾</div>
</div>


<div class="main">
    <div class="page-section active" id="page-competitor">
        <div class="page-header">
            <h1 class="page-title"><span>📊</span> 竞品分析</h1>
            <p class="page-desc">系统化对比竞品的产品、价格、服务、政策等维度，制定差异化竞争策略</p>
        </div>
        <div class="actions-bar">
            <button class="btn btn-primary" onclick="openAddModal()">➕ 添加竞品</button>
            <button class="btn btn-secondary" onclick="openDimensionModal()">📐 设置维度</button>
            <button class="btn btn-success" onclick="exportCompetitors()">📤 导出数据</button>
            <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清除数据</button>
        </div>
        <div class="grid-2">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📋 竞品列表</div>
                    <span id="competitorCount" style="font-size:13px;color:var(--gray-500);">0 个竞品</span>
                </div>
                <div class="card-body"><div id="competitorList" class="competitor-list"></div></div>
            </div>
            <div class="card">
                <div class="card-header"><div class="card-title">📊 雷达图分析</div></div>
                <div class="card-body"><div class="chart-container"><canvas id="radarChart"></canvas></div></div>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><div class="card-title">📈 对比表格</div></div>
            <div class="card-body">
                <div class="comparison-table-wrapper">
                    <table class="comparison-table" id="comparisonTable">
                        <thead><tr id="comparisonHead"></tr></thead>
                        <tbody id="comparisonBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <div class="page-section" id="page-scripts">
        <div class="page-header">
            <h1 class="page-title"><span>💬</span> 话术库</h1>
            <p class="page-desc">B2B机构触达全场景话术，融合Tony梁老师同城自媒体获客方法论，可持续迭代更新</p>
        </div>
        <div id="scriptsContainer"></div>
    </div>


    <div class="page-section" id="page-tools">
        <div class="page-header">
            <h1 class="page-title"><span>🛠️</span> 工具库</h1>
            <p class="page-desc">5A模型各节点工具资料，助力销售全流程，持续更新中</p>
        </div>
        <div class="grid-3" id="toolsGrid"></div>
    </div>


    <div class="page-section" id="page-enneagram">
        <div class="page-header">
            <h1 class="page-title"><span>🧩</span> 九型人格测试</h1>
            <p class="page-desc">了解自己的性格类型，发挥优势，补齐短板</p>
        </div>
        <div id="enneagramContainer"></div>
    </div>
</div>


<div class="modal-overlay" id="addModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">添加竞品</div>
            <button class="modal-close" onclick="closeAddModal()">×</button>
        </div>
        <div class="modal-body" id="addModalBody">
            <input type="hidden" id="editId">
            <div class="form-grid">
                <div class="form-group full">
                    <label class="form-label">竞品名称 *</label>
                    <input type="text" class="form-input" id="name" placeholder="竞品机构名称">
                </div>
                <div class="form-group">
                    <label class="form-label">主营产品国家条线</label>
                    <input type="text" class="form-input" id="priceRange" placeholder="如：英国、澳洲、加拿大">
                </div>
                <div class="form-group">
                    <label class="form-label">是否BC同做</label>
                    <select class="form-select" id="targetMarket">
                        <option value="">请选择</option>
                        <option value="是">是</option>
                        <option value="否">否</option>
                        <option value="部分">部分项目</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label class="form-label">国内优势地区</label>
                    <input type="text" class="form-input" id="features" placeholder="如：北上广深、江浙沪">
                </div>
                <div class="form-group full">
                    <label class="form-label">佣金政策</label>
                    <textarea class="form-textarea" id="advantages" placeholder="描述佣金政策和结算方式"></textarea>
                </div>
                <div class="form-group full">
                    <label class="form-label">服务支持</label>
                    <textarea class="form-textarea" id="policies" placeholder="描述提供的服务和支持"></textarea>
                </div>
                <div class="form-group full">
                    <label class="form-label">其他支持</label>
                    <textarea class="form-textarea" id="notes" placeholder="其他支持内容"></textarea>
                </div>
            </div>
            <div style="margin-top:24px;">
                <h4 style="margin-bottom:16px;font-weight:600;">综合评分</h4>
                <div class="form-grid" id="scoreFields"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
            <button class="btn btn-primary" onclick="saveCompetitor()">保存</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="dimensionModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">设置维度</div>
            <button class="modal-close" onclick="closeDimensionModal()">×</button>
        </div>
        <div class="modal-body">
            <p style="color:var(--gray-500);margin-bottom:16px;">选择要在雷达图和对比表格中显示的维度：</p>
            <div class="form-grid" id="dimensionGrid"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeDimensionModal()">取消</button>
            <button class="btn btn-primary" onclick="saveDimensions()">保存</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>


<script>
var STORAGE_KEY = 'sales_empowerment_competitors';
var DIMENSIONS_KEY = 'sales_empowerment_dimensions';
var SCRIPTS_KEY = 'sales_empowerment_scripts';
var TOOLS_KEY = 'sales_empowerment_tools';

var DEFAULT_DIMENSIONS = [
    {id:'scoreProduct',name:'产品力',enabled:true},
    {id:'scorePrice',name:'佣金竞争力',enabled:true},
    {id:'scoreService',name:'服务质量',enabled:true},
    {id:'scoreBrand',name:'品牌影响力',enabled:true},
    {id:'scoreExpertise',name:'专业度',enabled:true},
    {id:'scoreSatisfaction',name:'客户满意度',enabled:true}
];

var COLORS = ['rgba(43,108,176,0.8)','rgba(56,161,105,0.8)','rgba(237,137,54,0.8)','rgba(128,90,213,0.8)','rgba(229,62,62,0.8)','rgba(56,178,172,0.8)'];
var competitors = [];
var dimensions = [];
var radarChart = null;
var currentQ = 0;
var answers = [];
var enneagramReady = false;

var DEFAULT_SCRIPTS = [
    {category:'首次触达话术（5种类型）',tag:'touch',tagName:'触达',items:[
        {title:'问题型开场',content:'"X总您好，我是UKEC的妮妮，专注英国留学B2B合作。冒昧问一下，咱们机构目前送生去英国，最头疼的是哪个环节？是院校资源、返佣结算，还是学生转化率？"'},
        {title:'判断型开场',content:'"X总，我判断咱们机构在英国方向应该已经做得很成熟了。想请教一下，目前合作的英国项目里，有没有遇到过院校反馈慢、Offer下来不及时的情况？"'},
        {title:'对比型开场',content:'"X总，咱们机构现在合作的英国项目，是偏向百强院校还是保录取项目？我们UKEC这边有独特的招生官直连通道，想跟您对比看看哪种模式更适合。"'},
        {title:'案例型开场',content:'"X总，跟您分享个案例——上个月我们帮西安某机构送了8个学生去利兹大学，从递交到拿Offer平均只用12天。咱们这边有没有遇到过Offer卡在招生办迟迟下不来的情况？"'},
        {title:'避坑型开场',content:'"X总，最近英国这边有个坑得提醒您——好几个机构因为不清楚CAS保证金新政策，导致学生签证被卡。我们这边整理了最新避坑指南，能发您一份参考吗？"'}
    ]},
    {category:'深度挖需话术',tag:'need',tagName:'挖需',items:[

// ===== Init =====
document.addEventListener('DOMContentLoaded', function() {
    loadData();
    renderCompetitorList();
    renderComparisonTable();
    initChart();
    renderScripts();
    renderTools();
});

function loadData() {
    var d = localStorage.getItem(STORAGE_KEY);
    if (d) { try { competitors = JSON.parse(d); } catch(e) {} }
    var s = localStorage.getItem(DIMENSIONS_KEY);
    if (s) { try { dimensions = JSON.parse(s); } catch(e) {} }
    if (!dimensions.length) { dimensions = JSON.parse(JSON.stringify(DEFAULT_DIMENSIONS)); }
    if (!s) saveData();
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(competitors));
    localStorage.setItem(DIMENSIONS_KEY, JSON.stringify(dimensions));
}

function switchPage(page) {
    document.querySelectorAll('.page-section').forEach(function(p){p.classList.remove('active');});
    document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
    document.getElementById('page-'+page).classList.add('active');
    document.getElementById('nav-'+page).classList.add('active');
    if (page === 'enneagram' && !enneagramReady) { initEnneagram(); enneagramReady = true; }
}

function showToast(msg, type) {
    var t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');}, 2500);
}

function updateScore(id) {
    document.getElementById(id+'Val').textContent = document.getElementById(id).value;
}

// ===== Competitor CRUD =====
function openAddModal(editId) {
    document.getElementById('modalTitle').textContent = editId ? '编辑竞品' : '添加竞品';
    var fields = ['name','priceRange','targetMarket','features','advantages','policies','notes'];
    fields.forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
    document.getElementById('editId').value = editId || '';
    
    var enabled = dimensions.filter(function(d){return d.enabled;});
    var container = document.getElementById('scoreFields');
    container.innerHTML = '';
    enabled.forEach(function(d){
        var div = document.createElement('div');
        div.className = 'form-group';
        div.innerHTML = '<label class="form-label">'+d.name+'</label><div class="score-input-group">'
            + '<input type="range" class="score-slider" id="'+d.id+'" min="0" max="10" value="5" oninput="updateScore(\''+d.id+'\')">'
            + '<span class="score-value" id="'+d.id+'Val">5</span></div>';
        container.appendChild(div);
    });

    if (editId) {
        var c = competitors.find(function(x){return x.id===editId;});
        if (c) {
            fields.forEach(function(k){var el=document.getElementById(k);if(el)el.value=c[k]||'';});
            enabled.forEach(function(d){
                var el = document.getElementById(d.id);
                if (el && c[d.id] !== undefined) { el.value = c[d.id]; updateScore(d.id); }
            });
        }
    }
    document.getElementById('addModal').classList.add('active');
}

function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }

function saveCompetitor() {
    var name = document.getElementById('name').value.trim();
    if (!name) { showToast('请输入竞品名称','error'); return; }
    var enabled = dimensions.filter(function(d){return d.enabled;});
    var data = {
        name: name,
        priceRange: document.getElementById('priceRange').value,
        targetMarket: document.getElementById('targetMarket').value,
        features: document.getElementById('features').value,
        advantages: document.getElementById('advantages').value,
        policies: document.getElementById('policies').value,
        notes: document.getElementById('notes').value
    };
    enabled.forEach(function(d){data[d.id] = parseInt(document.getElementById(d.id).value);});
    var editId = document.getElementById('editId').value;
    if (editId) {
        var idx = competitors.findIndex(function(c){return c.id===editId;});
        if (idx>-1) {
            Object.keys(data).forEach(function(k){competitors[idx][k]=data[k];});
        }
        showToast('竞品已更新');
    } else {
        data.id = 'comp_'+Date.now();
        data.colorIndex = competitors.length % COLORS.length;
        competitors.push(data);
        showToast('竞品已添加');
    }
    saveData(); closeAddModal(); renderCompetitorList(); renderComparisonTable(); updateChart();
}

function editCompetitor(id) { openAddModal(id); }

function deleteCompetitor(id) {
    if (confirm('确定删除？')) {
        competitors = competitors.filter(function(c){return c.id!==id;});
        saveData(); renderCompetitorList(); renderComparisonTable(); updateChart();
        showToast('竞品已删除');
    }
}

function clearAllData() {
    if (confirm('确定清空所有数据？此操作不可恢复。')) {
        competitors = []; saveData();
        renderCompetitorList(); renderComparisonTable(); updateChart();
        showToast('数据已清空');
    }
}

    if (!competitors.length) { showToast('暂无数据'); return; }
    var data = {exportDate:new Date().toISOString(), total:competitors.length, competitors:competitors};
    var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '竞品数据_'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(url);
    showToast('数据已导出，请妥善保存');
}

function renderCompetitorList() {
    var list = document.getElementById('competitorList');
    document.getElementById('competitorCount').textContent = competitors.length+' 个竞品';
    if (!competitors.length) {
        list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无竞品数据</p><p style="font-size:12px;margin-top:8px;">点击"添加竞品"开始分析</p></div>';
        return;
    }
    list.innerHTML = '';
    competitors.forEach(function(c){
        var div = document.createElement('div');
        div.className = 'competitor-card fade-in';
        div.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'
            + '<div><strong style="font-size:16px;">'+escapeHtml(c.name)+'</strong></div>'
            + '<span class="color-dot" style="background:'+COLORS[c.colorIndex]+';width:12px;height:12px;border-radius:50%;flex-shrink:0;"></span></div>'
            + '<div style="margin-top:8px;font-size:13px;color:var(--gray-500);">📍 '+(c.priceRange||'未设置')+'<br>🔗 '+(c.targetMarket||'未设置')+'</div>'
            + '<div style="margin-top:12px;display:flex;gap:8px;">'
            + '<button class="btn btn-secondary" onclick="event.stopPropagation();editCompetitor(\''+c.id+'\')">编辑</button>'
            + '<button class="btn btn-danger" onclick="event.stopPropagation();deleteCompetitor(\''+c.id+'\')">删除</button></div>';
        list.appendChild(div);
    });
}

function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderComparisonTable() {
    var enabled = dimensions.filter(function(d){return d.enabled;});
    var thead = document.getElementById('comparisonHead');
    thead.innerHTML = '<th>竞品</th>';
    enabled.forEach(function(d){thead.innerHTML += '<th>'+d.name+'</th>';});
    var tbody = document.getElementById('comparisonBody');
    if (!competitors.length) { tbody.innerHTML = ''; return; }
    tbody.innerHTML = '';
    competitors.forEach(function(c){
        var tr = document.createElement('tr');
        tr.innerHTML = '<td><strong>'+escapeHtml(c.name)+'</strong></td>';
        enabled.forEach(function(d){tr.innerHTML += '<td>'+(c[d.id]||'-')+'</td>';});
        tbody.appendChild(tr);
    });
}

function openDimensionModal() {
    var grid = document.getElementById('dimensionGrid');
    grid.innerHTML = '';
    dimensions.forEach(function(d,i){
        var div = document.createElement('div');
        div.style.cssText = 'background:var(--gray-50);padding:12px;border-radius:8px;';
        div.innerHTML = '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">'
            + '<input type="checkbox" id="dim_'+i+'" '+(d.enabled?'checked':'')+'> '+d.name+'</label>';
        grid.appendChild(div);
    });
    document.getElementById('dimensionModal').classList.add('active');
}

function closeDimensionModal() { document.getElementById('dimensionModal').classList.remove('active'); }

function saveDimensions() {
    dimensions.forEach(function(d,i){d.enabled = document.getElementById('dim_'+i).checked;});
    saveData(); closeDimensionModal(); renderComparisonTable(); updateChart();
    showToast('维度设置已保存');
}

function initChart() {
    var ctx = document.getElementById('radarChart').getContext('2d');
    var enabled = dimensions.filter(function(d){return d.enabled;});
    radarChart = new Chart(ctx, {
        type:'radar',
        data:{labels:enabled.map(function(d){return d.name;}), datasets:[]},
        options:{
            responsive:true, maintainAspectRatio:true,
            scales:{r:{beginAtZero:true,max:10,ticks:{stepSize:2}}},
            plugins:{legend:{position:'bottom'}}
        }
    });
    updateChart();
}

function updateChart() {
    if (!radarChart) return;
    var enabled = dimensions.filter(function(d){return d.enabled;});
    radarChart.data.labels = enabled.map(function(d){return d.name;});
    radarChart.data.datasets = [];
    competitors.forEach(function(c,i){
        radarChart.data.datasets.push({
            label:c.name,
            data:enabled.map(function(d){return c[d.id]||0;}),
            backgroundColor:COLORS[c.colorIndex].replace('0.8','0.2'),
            borderColor:COLORS[c.colorIndex],
            pointBackgroundColor:COLORS[c.colorIndex]
        });
    });
    radarChart.update();
}

// ===== Scripts =====
function renderScripts() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(SCRIPTS_KEY)); } catch(e) {}
    var data = saved && saved.length ? saved : DEFAULT_SCRIPTS;
    var container = document.getElementById('scriptsContainer');
    container.innerHTML = '';
    var tagStyles = {touch:'#ebf8ff;color:var(--primary)', need:'#fefcbf;color:#975a16', objection:'#fed7d7;color:#c53030', close:'#c6f6d5;color:var(--green-500)', maintain:'var(--gray-100);color:var(--gray-600)'};
    data.forEach(function(cat, ci) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<div class="card-header"><div class="card-title">'+cat.category+'</div>'
            + '<button class="btn btn-secondary" onclick="addScriptItem('+ci+')">＋ 添加话术</button></div>'
            + '<div class="card-body" id="scriptCat'+ci+'"></div>';
        container.appendChild(card);
        var body = document.getElementById('scriptCat'+ci);
        cat.items.forEach(function(item, ii){
            var style = tagStyles[cat.tag] || 'var(--gray-100);color:var(--gray-600)';
            var div = document.createElement('div');
            div.className = 'script-item fade-in';
            div.innerHTML = '<div class="script-header"><span class="script-title">'+escapeHtml(item.title)+'</span>'
                + '<span style="display:flex;gap:4px;align-items:center;">'
                + '<span class="script-tag" style="background:'+style+';">'+cat.tagName+'</span>'
                + '<button class="btn btn-secondary" style="padding:2px 8px;font-size:11px;" onclick="editScriptItem('+ci+','+ii+')">✏️</button>'
                + '<button class="btn btn-danger" style="padding:2px 8px;font-size:11px;" onclick="deleteScriptItem('+ci+','+ii+')">🗑️</button></span></div>'
                + '<div class="script-content">'+escapeHtml(item.content)+'</div>'
                + '<div class="script-actions"><button class="btn btn-secondary" onclick="copyScript(this)">📋 复制</button></div>';
            body.appendChild(div);
        });
    });
}

function copyScript(btn) {
    var content = btn.closest('.script-item').querySelector('.script-content').textContent;
    navigator.clipboard.writeText(content).then(function(){showToast('话术已复制');});
}

function getScriptsData() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(SCRIPTS_KEY)); } catch(e) {}
    return saved && saved.length ? saved : DEFAULT_SCRIPTS.map(function(x){return JSON.parse(JSON.stringify(x));});
}

function addScriptItem(ci) {
    var title = prompt('输入话术标题：');
    if (!title) return;
    var content = prompt('输入话术内容：');
    if (!content) return;
    var data = getScriptsData();
    data[ci].items.push({title:title, content:content});
    localStorage.setItem(SCRIPTS_KEY, JSON.stringify(data));
    renderScripts();
    showToast('话术已添加');
}

function editScriptItem(ci, ii) {
    var data = getScriptsData();
    var item = data[ci].items[ii];
    if (!item) return;
    var title = prompt('话术标题：', item.title);
    if (!title) return;
    var content = prompt('话术内容：', item.content);
    if (!content) return;
    item.title = title; item.content = content;
    localStorage.setItem(SCRIPTS_KEY, JSON.stringify(data));
    renderScripts();
    showToast('话术已更新');
}

function deleteScriptItem(ci, ii) {
    if (!confirm('确定删除这条话术？')) return;
    var data = getScriptsData();
    data[ci].items.splice(ii, 1);
    localStorage.setItem(SCRIPTS_KEY, JSON.stringify(data));
    renderScripts();
    showToast('话术已删除');
}

// ===== Tools =====
function getToolsData() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(TOOLS_KEY)); } catch(e) {}
    return saved && saved.length ? saved : DEFAULT_TOOLS.map(function(x){return JSON.parse(JSON.stringify(x));});
}

function renderTools() {
    var data = getToolsData();
    var grid = document.getElementById('toolsGrid');
    grid.innerHTML = '';
    data.forEach(function(t, i){
        var div = document.createElement('div');
        div.className = 'tool-card';
        div.innerHTML = '<div class="tool-icon">'+t.icon+'</div><div class="tool-name">'+escapeHtml(t.name)+'</div>'
            + '<div class="tool-desc">'+escapeHtml(t.desc)+'</div><span class="tool-tag">'+escapeHtml(t.tag)+'</span>'
            + '<div style="margin-top:12px;display:flex;gap:4px;">'
            + '<button class="btn btn-secondary" style="padding:4px 10px;font-size:12px;" onclick="event.stopPropagation();editTool('+i+')">✏️</button>'
            + '<button class="btn btn-danger" style="padding:4px 10px;font-size:12px;" onclick="event.stopPropagation();deleteTool('+i+')">🗑️</button></div>';
        grid.appendChild(div);
    });
    // add button
    var addDiv = document.createElement('div');
    addDiv.className = 'tool-card';
    addDiv.style.cssText = 'display:flex;align-items:center;justify-content:center;border:2px dashed var(--gray-300);cursor:pointer;';
    addDiv.onclick = function(){addTool();};
    addDiv.innerHTML = '<div style="text-align:center;"><div style="font-size:32px;margin-bottom:8px;">＋</div><div style="font-size:14px;color:var(--gray-500);">添加新工具</div></div>';
    grid.appendChild(addDiv);
}

function addTool() {
    var name = prompt('工具名称：');
    if (!name) return;
    var desc = prompt('工具描述：') || '';
    var tag = prompt('标签（如 Aware 认知）：') || '';
    var data = getToolsData();
    data.push({icon:'📎', name:name, desc:desc, tag:tag});
    localStorage.setItem(TOOLS_KEY, JSON.stringify(data));
    renderTools();
    showToast('工具已添加');
}

function editTool(i) {
    var data = getToolsData();
    var t = data[i];
    if (!t) return;
    var name = prompt('名称：', t.name); if (!name) return;
    var desc = prompt('描述：', t.desc) || '';
    var tag = prompt('标签：', t.tag) || '';
    t.name = name; t.desc = desc; t.tag = tag;
    localStorage.setItem(TOOLS_KEY, JSON.stringify(data));
    renderTools();
    showToast('工具已更新');
}

function deleteTool(i) {
    if (!confirm('确定删除？')) return;
    var data = getToolsData();
    data.splice(i, 1);
    localStorage.setItem(TOOLS_KEY, JSON.stringify(data));
    renderTools();
    showToast('工具已删除');
}

// ===== Enneagram =====
function initEnneagram() {
    var container = document.getElementById('enneagramContainer');
    container.innerHTML = ''
        + '<div class="card"><div class="card-body">'
        + '<div id="testStart"><h3 style="margin-bottom:16px;">欢迎来到九型人格测试</h3>'
        + '<p style="color:var(--gray-500);margin-bottom:20px;">本测试共'+questions.length+'题，每题选择最符合你直觉的选项。测试结果将帮助你了解自己的行为模式和沟通风格，更好地定位销售策略。</p>'
        + '<button class="btn btn-primary" onclick="startTest()">开始测试</button></div>'
        + '<div id="testContent" style="display:none;">'
        + '<div class="progress-bar" style="margin-bottom:20px;"><div class="progress-fill" id="progressFill"></div></div>'
        + '<div class="question-card"><div class="question-text" id="questionText"></div><div id="optionsContainer"></div></div>'
        + '<div style="display:flex;justify-content:space-between;margin-top:16px;">'
        + '<button class="btn btn-secondary" onclick="prevQ()" id="prevBtn" style="visibility:hidden;">← 上一题</button>'
        + '<button class="btn btn-primary" onclick="nextQ()" id="nextBtn">下一题 →</button></div></div>'
        + '<div id="testResult" style="display:none;"></div></div></div>'
        + '<div id="typeReference" style="display:none;" class="card"><div class="card-header"><div class="card-title">📖 九型人格速查表</div></div>'
        + '<div class="card-body"><div class="ref-table-wrapper"><table class="ref-table"><thead><tr>'
        + '<th>类型</th><th>名称</th><th>注意力焦点</th><th>核心恐惧</th><th>沟通建议</th>'
        + '</tr></thead><tbody id="typeTableBody"></tbody></table></div></div></div>';
    
    var tbody = document.getElementById('typeTableBody');
    if (tbody) {
        tbody.innerHTML = '';
        typeData.forEach(function(t){
            var tr = document.createElement('tr');
            tr.innerHTML = '<td><span class="type-dot" style="background:'+t.color+'"></span> '+t.num+'</td>'
                + '<td><strong>'+t.name+'</strong></td>'
                + '<td>'+t.attention.join('、')+'</td>'
                + '<td>'+t.fear.join('、')+'</td>'
                + '<td style="font-size:12px;">'+(t.sellAdvice||'').substring(0,40)+'...</td>';
            tbody.appendChild(tr);
        });
    }
}

function startTest() {
    currentQ = 0;
    answers = Array(questions.length).fill(-1);
    document.getElementById('testStart').style.display = 'none';
    document.getElementById('testContent').style.display = 'block';
    document.getElementById('testResult').style.display = 'none';
    showQ();
}

function showQ() {
    document.getElementById('progressFill').style.width = ((currentQ/questions.length)*100)+'%';
    document.getElementById('questionText').textContent = questions[currentQ].q;
    var container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    questions[currentQ].opts.forEach(function(o, i){
        var div = document.createElement('div');
        div.className = 'option-item' + (answers[currentQ]===i?' selected':'');
        div.textContent = o.text;
        div.onclick = function(){selOpt(i);};
        container.appendChild(div);
    });
    document.getElementById('prevBtn').style.visibility = currentQ>0?'visible':'hidden';
    document.getElementById('nextBtn').textContent = currentQ<questions.length-1?'下一题 →':'查看结果';
}

function selOpt(i) { answers[currentQ]=i; showQ(); }

function prevQ() { if (currentQ>0) { currentQ--; showQ(); } }

function nextQ() {
    if (answers[currentQ]===-1) { showToast('请选择一个选项'); return; }
    if (currentQ < questions.length-1) { currentQ++; showQ(); }
    else showResult();
}

function showResult() {
    document.getElementById('testContent').style.display = 'none';
    var scores = {};
    answers.forEach(function(optIdx, qIdx){
        if (optIdx === -1) return;
        questions[qIdx].opts[optIdx].types.forEach(function(t){ scores[t] = (scores[t]||0)+1; });
    });
    var maxType = 1, maxScore = 0;
    for (var i=1; i<=9; i++) { if ((scores[i]||0) > maxScore) { maxScore = scores[i]; maxType = i; } }
    var t = typeData.find(function(x){return x.num===maxType;});
    if (!t) return;
    var resultDiv = document.getElementById('testResult');
    resultDiv.style.display = 'block';
    var scoreBars = '';
    Object.keys(scores).sort(function(a,b){return b-a;}).forEach(function(k){
        scoreBars += '<span style="background:var(--gray-100);padding:4px 12px;border-radius:12px;font-size:13px;margin:2px;">'+k+'型: '+scores[k]+'票</span>';
    });
    resultDiv.innerHTML = '<div class="result-card fade-in">'
        + '<div style="font-size:64px;margin-bottom:16px;">'+t.icon+'</div>'
        + '<h2 style="color:var(--primary);margin-bottom:4px;">'+t.name+'（'+t.num+'型）</h2>'
        + '<p style="color:var(--gray-500);margin-bottom:16px;">'+t.subtitle+'</p>'
        + '<div style="background:var(--gray-50);border-radius:12px;padding:20px;text-align:left;margin-bottom:16px;">'
        + '<p><strong>核心优势：</strong>'+t.strength+'</p>'
        + '<p style="margin-top:8px;"><strong>工作风格：</strong>'+t.workstyle+'</p>'
        + '<p style="margin-top:8px;"><strong>注意力焦点：</strong>'+t.attention.join('、')+'</p>'
        + '<p style="margin-top:8px;"><strong>核心恐惧：</strong>'+t.fear.join('、')+'</p>'
        + '<p style="margin-top:12px;"><strong>💡 销售建议：</strong>'+t.sellAdvice+'</p></div>'
        + '<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;">'+scoreBars+'</div>'
        + '<div style="display:flex;gap:12px;justify-content:center;">'
        + '<button class="btn btn-primary" onclick="startTest()">重新测试</button>'
        + '<button class="btn btn-secondary" onclick="document.getElementById(\'typeReference\').style.display=\'block\';this.scrollIntoView({behavior:\'smooth\'})">查看完整速查表</button></div>'
        + '<p style="color:var(--gray-400);font-size:12px;margin-top:12px;">*本测试为简化版，仅供参考</p></div>';
}
</script>
